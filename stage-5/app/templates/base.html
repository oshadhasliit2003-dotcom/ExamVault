<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Exam Portal{% endblock %}</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#eef2f6;color:#1d2733;margin:0}
header{background:#1b5e4b;color:#fff;padding:14px 22px;display:flex;justify-content:space-between}
header a{color:#fff}
main{max-width:640px;margin:24px auto;padding:0 18px}
.card{background:#fff;border:1px solid #cfd8e1;border-radius:6px;padding:18px 20px}
label{display:block;margin:10px 0 4px}input{padding:8px;width:100%;box-sizing:border-box}
button{margin-top:14px;padding:9px 16px;background:#1b5e4b;color:#fff;border:0;border-radius:4px}
.err{color:#a02020}footer{text-align:center;font-size:.8rem;color:#5b6775;margin:24px}
</style></head><body>
<header><strong>Halcyon Ridge Exam Portal</strong>{% if user %}<span>{{ user.username }} | <a href="/logout">Log out</a></span>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
<footer>Fictional training environment for a cybersecurity exercise.</footer>
</body></html>
